name: Build packages
# Builds every release file. The release and nightly workflows call this one, so a nightly
# is made exactly like a stable release.
on:
  workflow_call:
    inputs:
      # Names a nightly build, such as 1.0.0-nightly.20261004.abc1234; empty for a release.
      version:
        type: string
        default: ''

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - run: pwsh -NoProfile -File scripts/build.ps1
      - run: pwsh -NoProfile -File scripts/build-installer.ps1 -Compiler "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/EchoBridge.exe
            dist/EchoBridge-Setup.exe
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    # Debian 12 has an older glibc than current distributions, and a program built against an
    # old glibc runs on the newer ones too. Building on the newest image would not.
    container: debian:12
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends             build-essential pkg-config cmake git curl ca-certificates xz-utils dpkg-dev libicu72 libpipewire-0.3-dev libclang-dev libfontconfig1-dev libxkbcommon-dev
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          # PowerShell writes the license notices (scripts/notices.ps1).
          curl -fsSL https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/powershell-7.4.6-linux-x64.tar.gz -o /tmp/pwsh.tar.gz
          mkdir -p /opt/pwsh && tar -xzf /tmp/pwsh.tar.gz -C /opt/pwsh && ln -s /opt/pwsh/pwsh /usr/local/bin/pwsh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build-linux.sh
        env:
          ECHOBRIDGE_VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/linux/
          if-no-files-found: error
