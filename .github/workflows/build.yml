name: Build packages
# Builds every release file. The release and nightly workflows call this one, so a nightly
# is made exactly like a stable release.
on:
  workflow_call:
    inputs:
      # Names a nightly build, such as 1.0.0-nightly.20261004.abc1234; empty for a release.
      version:
        type: string
        default: ''

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - run: pwsh -NoProfile -File scripts/build.ps1
      - run: pwsh -NoProfile -File scripts/build-installer.ps1 -Compiler "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/EchoBridge.exe
            dist/EchoBridge-Setup.exe
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev libclang-dev pkg-config libfontconfig1-dev libxkbcommon-dev
      - run: scripts/build-linux.sh
        env:
          ECHOBRIDGE_VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/linux/
          if-no-files-found: error
