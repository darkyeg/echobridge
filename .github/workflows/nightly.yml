name: Nightly
# A build of main every night, published as the pre-release "nightly" for testers. It is
# replaced each time, and skipped when main has not changed since the last one.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if main has not changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git rev-parse HEAD)
          last=$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "version=$crate-nightly.$(date -u +%Y%m%d).${head:0:7}" >> "$GITHUB_OUTPUT"
          if [ "$head" = "$last" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "main is unchanged since the last nightly ($head)."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Collect files
        run: |
          mkdir out
          cp artifacts/windows/* artifacts/linux/* out/
          cp scripts/install.sh scripts/install.ps1 out/
          (cd out && sha256sum EchoBridge-Setup.exe >> SHA256SUMS-windows.txt)
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly out/* --repo "$GITHUB_REPOSITORY" --prerelease --target "$sha" \
            --title "Nightly ${{ needs.plan.outputs.version }}" \
            --notes "Automatic build of main at $sha. It may be unfinished; the stable releases are on the Releases page. Install: \`curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/install.sh | sh -s -- --nightly\`"
