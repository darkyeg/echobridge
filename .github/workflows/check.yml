name: Checks
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml selects the toolchain and installs clippy and rustfmt.
      # Hosted images may retain an older stable release than the workspace requires.
      - run: rustup update stable
      # Keyed on Cargo.lock, the toolchain and the job, so a changed dependency rebuilds only
      # what it touches. Each job keeps its own cache, since checks and releases build differently.
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Live fake devices use the wall clock; competing simulations distort their cadence.
      - run: cargo test --workspace --locked -- --test-threads=1
      - run: pwsh -NoProfile -File scripts/build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: EchoBridge-Windows
          path: dist/

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable
      # Keyed on Cargo.lock, the toolchain and the job, so a changed dependency rebuilds only
      # what it touches. Each job keeps its own cache, since checks and releases build differently.
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev libclang-dev pkg-config libfontconfig1-dev libxkbcommon-dev \
            pipewire wireplumber dbus-user-session
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked -- --test-threads=1
      # The installer scripts must stay valid POSIX shell.
      - run: sh -n scripts/install.sh && bash -n scripts/build-linux.sh

  # The release packages, built exactly as a release builds them (on Debian 12).
  package:
    uses: ./.github/workflows/build.yml

  # Does the installer work on each distribution? Each one starts without EchoBridge's
  # libraries, so this also proves install.sh adds what is missing.
  install:
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Debian 12, image: "debian:12", prepare: "apt-get update && apt-get install -y tar gzip", deb: true }
          - { name: Debian 13, image: "debian:trixie", prepare: "apt-get update && apt-get install -y tar gzip", deb: true }
          - { name: Ubuntu 24.04, image: "ubuntu:24.04", prepare: "apt-get update && apt-get install -y tar gzip", deb: true }
          - { name: Fedora, image: "fedora:latest", prepare: "dnf install -y tar gzip" }
          - { name: Arch, image: "archlinux:latest", prepare: "pacman -Sy --noconfirm tar gzip" }
          - { name: openSUSE Tumbleweed, image: "opensuse/tumbleweed", prepare: "zypper --non-interactive install tar gzip" }
    name: install (${{ matrix.name }})
    container: ${{ matrix.image }}
    steps:
      - run: ${{ matrix.prepare }}
      - uses: actions/download-artifact@v7
        with:
          name: linux
          path: dist
      - name: Install with install.sh
        run: |
          tar -xzf dist/EchoBridge-*-linux-x86_64.tar.gz -C /tmp
          /tmp/EchoBridge-*-linux-x86_64/install.sh --yes
          test -x "$HOME/.local/bin/EchoBridge"
          if ldd "$HOME/.local/bin/EchoBridge" | grep "not found"; then exit 1; fi
          # There is no sound server here, so it must fail cleanly and say so.
          status=0
          "$HOME/.local/bin/EchoBridge" --list-devices > out.txt 2>&1 || status=$?
          cat out.txt
          test "$status" -lt 126
          /tmp/EchoBridge-*-linux-x86_64/install.sh --uninstall
          test ! -e "$HOME/.local/bin/EchoBridge"
      - name: Install the .deb
        if: matrix.deb
        run: |
          apt-get install -y ./dist/echobridge_*_amd64.deb
          test -x /usr/bin/EchoBridge
          if ldd /usr/bin/EchoBridge | grep "not found"; then exit 1; fi
          apt-get remove -y echobridge
