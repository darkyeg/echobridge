name: Windows checks
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml selects the toolchain and installs clippy and rustfmt.
      # Hosted images may retain an older stable release than the workspace requires.
      - run: rustup update stable
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Live fake devices use the wall clock; competing simulations distort their cadence.
      - run: cargo test --workspace --locked -- --test-threads=1
      - run: pwsh -NoProfile -File scripts/build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: EchoBridge-Windows
          path: dist/
