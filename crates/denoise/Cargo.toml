[package]
name = "echobridge-denoise"
description = "DeepFilterNet3 speech enhancement for EchoBridge, run synchronously one hop at a time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# DeepFilterNet 0.5.6 (MIT OR Apache-2.0) with its DFN3 model compiled in.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
thiserror.workspace = true

[dev-dependencies]
hound = "3"
rand = "0.8"
rand_distr = "0.4"

[lints]
workspace = true
